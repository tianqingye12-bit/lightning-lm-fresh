# WheelTec + RoboSense Airy S100 离线建图配置
# 数据包: s100_fusion_20261114_164937 (ROS2 humble / sqlite3, ~212 s)
#   点云: /lidar/lidar_02/points  (frame=airy_frame, ~10 Hz, 字段含 timestamp 秒)
#   IMU:  /lidar/lidar_02/imu     (frame=airy_frame, ~100 Hz, 加速度约 g 单位，初始化会自动标定)
#   相机: /camera/color/image_raw + /camera/depth/image_raw (去车用 garage_clean.yaml)
# 注意:
#   - 本包没有 /imu；实时车上若另有底盘 /imu，请用 default_robosense.yaml。
#   - 录包存在数秒级点云/IMU 空洞 (最大约 7.6 s)。LIO 对 >1 s 间隔会拒绝传播，
#     空洞后可能长时间 skip；完整离线测试仍可跑通前半连续段并落盘。
# 运行: ./scripts/run_s100_offline.sh
#   无界面: HEADLESS=1 ./scripts/run_s100_offline.sh
common:
  dataset: "robosense"
  lidar_topic: "/lidar/lidar_02/points"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/lidar/lidar_02/imu"

# fasterlio 参数
fasterlio:
  lidar_type: 4                # 4 = RoboSense (PointCloud2 + double timestamp)
  scan_line: 96                # Airy 本包 ring 范围 0..95；RoboSense 预处理主要用逐点时间戳
  blind: 0.5                   # 盲区 (m)
  time_scale: 1e-3             # 仅 Velodyne (lidar_type=2) 生效

  skip_lidar_num: 0
  point_filter_num: 4          # 本包单帧约 7.8 万点，适当抽稀即可
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1

  use_aa: false

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  # 点云与雷达内置 IMU 同为 airy_frame，外参为单位变换。
  # p_imu = R * p_lidar + T
  extrinsic_T: [ 0.0, 0.0, 0.0 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]

  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 2.0

  enable_icp_part: true
  plane_icp_weight: 300.0
  kalman_R: 0.1
  min_pts: 300
  imu_filter: true
  proj_kfs: false

  # 略放宽预测窗口，吸收本包偶发的短间隔抖动；无法跨越录包中的数秒空洞。
  imu_prediction:
    max_step_s: 0.15
    max_horizon_s: 0.50
    stats_interval: 200

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.2

system:
  with_loop_closing: true
  with_ui: true
  with_2dui: false
  with_g2p5: true
  step_on_kf: false            # 离线批量跑通，不在关键帧处暂停

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 0
  map_path: ./data/s100_fusion_20261114_164937/
  pub_tf: true

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: true


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 90.0
  grid_search_angle_step: 10
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 0.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 10.0
  height_min: -10.0
  range_max: 70
  range_min: 0.5
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
