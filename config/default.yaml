# 针对NCLT的配置
common:
  dataset: "nclt"
  lidar_topic: "points_raw"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/livox/imu"

# fasterlio 参数
fasterlio:
  lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
  scan_line: 32
  blind: 0.1                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情况
  point_filter_num: 4 # 点云采样参数
  max_iteration: 4 # 最大迭代次数
  filter_size_scan: 0.5 # 对scan进行的降采样
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: false  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0, 0, 0.28 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 10.0

  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 500
  imu_filter: false
  proj_kfs: false

  # 可选；其他旧配置不增加这一节也可运行，使用同样默认值。
  feature_quality:
    enabled: true                # 中心化 PCA 平面质量检查；false 使用原 QR 拟合
    min_spread: 0.03             # 次大特征值的平方根下限，单位 m
    min_tangent_ratio: 0.01      # 次大/最大特征值下限，拒绝近似共线邻域
    max_normal_ratio: 0.10       # 最小/次大特征值上限，拒绝非平面邻域
    robust_weight: true         # 点面残差采用 Huber 权重
    huber_delta: 0.10            # Huber 拐点，单位 m
    stats_interval: 20          # 每 20 个配准扫描输出统计；0 关闭输出

  # 地图细节：以下为兼容旧行为的值。M2DGR 测试请用 scripts/configure_map_detail.py 生成独立配置。
  # filter_size_scan 管配准；filter_size_map 管局部补点筛选；ivox_grid_resolution 管搜索索引。
  map_detail:
    input_point_filter_num: 0    # 0 沿用 point_filter_num；1 保留所有通过 ROI/盲区过滤的输入点
    registration_min_ratio: 0.1 # 点数比例低于此值时退回 0.1m 配准；0 仅按 min_pts 触发回退
    keyframe_resolution: 0.0    # 关键帧体素(m)；0 保留去畸变后的预处理点云
    keyframe_max_points: 0      # 每关键帧点数上限；0 不限制；超过时全点序均匀抽样
    export_resolution: 0.1     # 全局 PCD 导出体素(m)，独立于配准
    local_fill:
      enabled: false           # 仅在配准成功且没有生成关键帧时尝试补点
      min_interval: 0.2        # 距上一次地图更新的最小间隔(s)
      translation: 0.2         # 位移(m)，与转角条件为 OR，与间隔条件为 AND
      rotation_deg: 3.0
      min_effective: 20        # 最少有效点面/点点约束数


g2p5:
  esti_floor: false   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.50  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.2 # 栅格地图分辨率

system:
  with_loop_closing: true # 是否需要回环检测
  with_ui: true # 是否需要3D UI
  with_2dui: false # 是否需要2D UI
  with_g2p5: true # 是否需要栅格地图
  step_on_kf: false # 是否在关键帧处暂停
  loop_display:
    enabled: true       # 回环优化后后台刷新 Pangolin 全局关键帧地图
    min_interval: 2.0   # 两次后台重建至少间隔(s)，合并等待中的旧请求
    max_points: 200000  # 显示点数上限；不影响保存地图

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/new_map/
  pub_tf: true

loop_closing:
  loop_kf_gap: 20       # 每隔多少个关键帧检查一次
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 50     # 历史关键帧与当前帧的ID间隔
  max_range: 20.0       # 候选帧的最大距离
  ndt_score_th: 1.3     # ndt位姿分值
  with_height: false
  validation:
    overlap_distance: 0.5   # 最近邻距离门槛(m)
    min_overlap: 0.3        # 当前关键帧采样点中落入历史子图的比例
    max_inlier_rmse: 0.3   # 重叠内点 RMSE(m)
    max_translation: 5.0   # 相对匹配初值的最大平移修正(m)
    max_rotation_deg: 30.0
    max_samples: 2000      # 每候选最多验证多少点
    min_inliers: 50
    max_candidates: 3      # 每次最多执行多少次多分辨率 NDT
    max_loop_chi2: 25.0    # 图中回环边误差门槛，独立于 Cauchy 核尺度
    refine_iterations: 10  # 异常边剔除后的第二次优化迭代上限


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 10.0
  height_min: 0.5
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1

